[package]
name = "pagic-engine"
description = "Pagic engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-docpath = { workspace = true }
pagic-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
pagic-render = { workspace = true }
pagic-cos = { workspace = true }
pagic-organize = { workspace = true }
pagic-annot = { workspace = true }
pagic-forms = { workspace = true }
pagic-xfa = { workspace = true }
pagic-edit = { workspace = true }
pagic-audit = { workspace = true }
pagic-redact = { workspace = true }
pagic-print = { workspace = true }
pagic-xfdf = { workspace = true }
pagic-sign = { workspace = true }
pagic-optimize = { workspace = true }
pagic-a11y = { workspace = true }
pagic-ocr = { workspace = true }
pagic-js = { workspace = true }
pagic-compare = { workspace = true }
pagic-preflight = { workspace = true }
pagic-export = { workspace = true }
pagic-fonts = { workspace = true }
pagic-create = { workspace = true }
pagic-model = { workspace = true }
pagic-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (through image and pagic-create): image's TiffEncoder can't set the
# resolution or the compression of an exported page.
tiff = "0.11"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"
unicode-segmentation = "1.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today"). The workspace
# entry is std-only; this target adds `clock` for `chrono::Local::now`.
chrono = { workspace = true, features = ["clock"] }

[dev-dependencies]
pagic-testkit = { workspace = true }
