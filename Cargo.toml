[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["vendor", "vendor/pagic-libs", "vendor/pagic-winit"]
default-members = ["crates/*", "apps/pagic", "apps/pagic-cli", "xtask"]

[workspace.package]
version = "0.14.1"
edition = "2024"
authors = ["Arafat <typearaf@gmail.com>"]
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/arafatic/pagic"

[workspace.dependencies]
# Shared frontend components; engines remain independent of egui.
craft-ui = { path = "vendor/pagic-libs/crates/ui", version = "0.1.0", features = ["serde"] }
# Quit the macOS way (#1136): ⌘Q asks about unsaved changes, and closing quits through `terminate:`.
craft-quit = { path = "vendor/pagic-libs/crates/quit", version = "0.1.0" }
# One menu definition for the native macOS menu bar and the in-window bar elsewhere.
craft-menu = { path = "vendor/pagic-libs/crates/menu", version = "0.1.0" }
craft-keymap = { path = "vendor/pagic-libs/crates/keymap", version = "0.1.0", default-features = false }
# Shared system spooler; document composition remains in pagic-print.
craft-print = { path = "vendor/pagic-libs/crates/print", version = "0.1.0" }
# Whether a path stored in a document may be opened (GoToR link targets).
craft-docpath = { version = "0.1.0", path = "vendor/pagic-libs/crates/docpath" }
craft-update = { path = "vendor/pagic-libs/crates/update", version = "=0.1.0", features = ["egui"] }
# internal
pagic-geom = { path = "crates/geom", version = "0.14.1" }
pagic-filters = { path = "crates/filters", version = "0.14.1" }
pagic-cos = { path = "crates/cos", version = "0.14.1" }
pagic-crypt = { path = "crates/crypt", version = "0.14.1" }
pagic-organize = { path = "crates/organize", version = "0.14.1" }
pagic-measure = { path = "crates/measure", version = "0.14.1" }
pagic-annot = { path = "crates/annot", version = "0.14.1" }
pagic-audit = { path = "crates/audit", version = "0.14.1" }
pagic-fonts = { path = "crates/fonts", version = "0.14.1" }
pagic-model = { path = "crates/model", version = "0.14.1" }
pagic-content = { path = "crates/content", version = "0.14.1" }
pagic-redact = { path = "crates/redact", version = "0.14.1" }
pagic-print = { path = "crates/print", version = "0.14.1" }
pagic-xfdf = { path = "crates/xfdf", version = "0.14.1" }
pagic-sign = { path = "crates/sign", version = "0.14.1" }
pagic-optimize = { path = "crates/optimize", version = "0.14.1" }
pagic-a11y = { path = "crates/a11y", version = "0.14.1" }
pagic-oracle = { path = "crates/oracle", version = "0.14.1" }
pagic-testkit = { path = "crates/testkit", version = "0.14.1" }
pagic-ocr = { path = "crates/ocr", version = "0.14.1" }
pagic-js = { path = "crates/js", version = "0.14.1" }
pagic-compare = { path = "crates/compare", version = "0.14.1" }
pagic-preflight = { path = "crates/preflight", version = "0.14.1" }
pagic-export = { path = "crates/export", version = "0.14.1" }
pagic-edit = { path = "crates/edit", version = "0.14.1" }
pagic-create = { path = "crates/create", version = "0.14.1" }
pagic-forms = { path = "crates/forms", version = "0.14.1" }
pagic-xfa = { path = "crates/xfa", version = "0.14.1" }
pagic-render = { path = "crates/render", version = "0.14.1" }
pagic-engine = { path = "crates/engine", version = "0.14.1" }
pagic-platform = { path = "crates/platform", version = "0.14.1" }
pagic-ui-egui = { path = "crates/ui-egui", version = "0.14.1" }
pagic-automation = { path = "crates/automation", version = "0.14.1", default-features = false }

# pdf
hayro = "0.7.1"
hayro-syntax = "0.7.2"
lopdf = "0.45"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
weezl = "0.2"

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
kurbo = "0.13"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

# testing
proptest = "1"

# ui
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"
# Monotonic time for logic-only work on native and web (`App::logic` runs without a UI pass).
web-time = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Dependencies
# carry no debug info and our own crates only line tables: backtraces and
# panics still show file and line, while test binaries and the target dir stay
# small (each UI test binary had a 500-600 MB PDB on Windows, #454).
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.low-disk]
inherits = "dev"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

# Vendored, patched third-party crates (see vendor/README.md). Each patch is meant to go upstream.
[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro = { path = "vendor/hayro" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-cmap = { path = "vendor/hayro-cmap" }
hayro-postscript = { path = "vendor/hayro-postscript" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
lopdf = { path = "vendor/lopdf" }
vello_common = { path = "vendor/vello_common" }
# The egui crates below retain their immutable git revision.
# winit uses the exact a517b3846ee8457d84ee4975110bfda6797c44dc source locally.
# The older `vendor/winit` and `vendor/egui-wgpu` copies remain provenance for
# earlier source guards. See vendor/README.md and vendor/pagic-winit/NOTICE-PAGIC-PROVENANCE.md.
ecolor = { git = "https://github.com/arafatic/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/arafatic/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/arafatic/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/arafatic/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/arafatic/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/arafatic/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/arafatic/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/arafatic/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/arafatic/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/arafatic/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/arafatic/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/arafatic/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/arafatic/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/arafatic/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { path = "vendor/pagic-winit" }
