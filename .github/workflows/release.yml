name: Pagic Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_draft:
        description: Attach all validated artifacts to a new private draft release (run on the matching version tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Resolve source and versions
    if: github.repository == 'arafatic/pagic' && github.event.repository.private == true
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.plan.outputs.source }}
      version: ${{ steps.plan.outputs.version }}
      store_version: ${{ steps.plan.outputs.store_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check version and release intent
        id: plan
        env:
          CREATE_DRAFT: ${{ inputs.create_draft }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tomllib

          sys.path.insert(0, "packaging/windows/msix")
          from msix import version

          app = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"]
          store = version(app)
          ref_type = os.environ["GITHUB_REF_TYPE"]
          tag = f"v{app}"
          if ref_type == "tag" and os.environ["GITHUB_REF_NAME"] != tag:
              sys.exit(f"Release tag must match Cargo.toml: expected {tag}")
          if os.environ["CREATE_DRAFT"] == "true" and ref_type != "tag":
              sys.exit(f"Draft releases require manual dispatch on the existing tag {tag}")
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              print(f"source={source}\nversion={app}\nstore_version={store}", file=outputs)
          print(f"Pagic {app} / Store {store} at {source}")
          PY

  windows:
    name: Windows x64 MSIX and EXE
    needs: plan
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      PAGIC_BUILD_SHA: ${{ needs.plan.outputs.source }}
      PAGIC_FONTS_REQUIRED: '1'
      PAGIC_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      PAGIC_STORE_VERSION: ${{ needs.plan.outputs.store_version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Validate packaging and local assets
        run: |
          python packaging/windows/msix/test_msix.py -v
          if ($LASTEXITCODE -ne 0) { throw 'MSIX regression tests failed' }
          cargo xtask assets
          if ($LASTEXITCODE -ne 0) { throw 'Local asset validation failed' }
      - name: Build and verify Store MSIX
        id: msix
        run: |
          ./packaging/windows/msix/package.ps1
          $Info = Get-Content dist/msix/build-info.json -Raw | ConvertFrom-Json
          if ($Info.source_commit -ne $env:PAGIC_BUILD_SHA -or $Info.package_version -ne $env:PAGIC_STORE_VERSION) {
            throw 'MSIX source or version does not match the release plan'
          }
          Get-Content dist/msix/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: Pagic-desktop-msix
          path: dist/msix/Pagic-${{ needs.plan.outputs.store_version }}-x64.msix
          overwrite: true
          if-no-files-found: error
          compression-level: 0
      - name: Build standalone EXE from the verified Windows payload
        id: setup
        run: |
          $Work = @(Get-ChildItem dist/msix -Directory -Filter 'work-*')
          if ($Work.Count -ne 1) { throw 'Expected exactly one MSIX work directory' }
          $Payload = (Resolve-Path (Join-Path $Work[0].FullName 'unpacked')).Path
          $ISCC = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $ISCC)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          $Output = (New-Item -ItemType Directory -Force dist/release).FullName
          $Name = "Pagic-$env:PAGIC_RELEASE_VERSION-x64-setup"
          & $ISCC "/DMyAppVersion=$env:PAGIC_RELEASE_VERSION" "/DReleasePayload=$Payload" "/O$Output" "/F$Name" packaging/windows/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          Get-FileHash (Join-Path $Output "$Name.exe") -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v7
        with:
          name: Pagic-desktop-exe
          path: dist/release/Pagic-${{ needs.plan.outputs.version }}-x64-setup.exe
          overwrite: true
          if-no-files-found: error
          compression-level: 0
      - name: Test Store MSIX installation, activation and PDF opening
        if: '!cancelled() && steps.msix.outcome == ''success'''
        run: |
          ./packaging/windows/msix/test-install.ps1 -Package "dist/msix/Pagic-$env:PAGIC_STORE_VERSION-x64.msix" -ReportDirectory dist/msix
      - name: Test standalone installer and GUI launch
        if: '!cancelled() && steps.setup.outcome == ''success'''
        run: |
          ./packaging/windows/test-setup.ps1 -Installer "dist/release/Pagic-$env:PAGIC_RELEASE_VERSION-x64-setup.exe" -LogPath dist/release/setup-install.log
      - name: Retain Windows validation reports
        if: '!cancelled()'
        uses: actions/upload-artifact@v7
        with:
          name: Pagic-Windows-validation
          path: |
            dist/msix/*.json
            dist/msix/AppxManifest.xml
            dist/release/setup-install.log
          overwrite: true
          if-no-files-found: ignore

  macos:
    name: macOS Apple silicon DMG
    needs: plan
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PAGIC_BUILD_SHA: ${{ needs.plan.outputs.source }}
      PAGIC_FONTS_REQUIRED: '1'
      PAGIC_VERSION: ${{ needs.plan.outputs.version }}
      MACOS_SIGN_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Validate identity, fonts and assets
        run: |
          test "$(uname -m)" = arm64
          python3 packaging/test-identity.py
          bash packaging/test-font-notices.sh
          cargo xtask assets
      - name: Build and verify production DMG (ad-hoc app, no notarization)
        run: |
          bash packaging/macos/package.sh --arch aarch64
          hdiutil verify "dist/release/pagic-$PAGIC_VERSION-macos-aarch64.dmg"
          shasum -a 256 "dist/release/pagic-$PAGIC_VERSION-macos-aarch64.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: Pagic-desktop-dmg
          path: dist/release/pagic-${{ needs.plan.outputs.version }}-macos-aarch64.dmg
          overwrite: true
          if-no-files-found: error
          compression-level: 0

  collect:
    name: Collect desktop artifacts and SHA-256
    needs: [plan, windows, macos]
    runs-on: ubuntu-latest
    env:
      PAGIC_VERSION: ${{ needs.plan.outputs.version }}
      PAGIC_STORE_VERSION: ${{ needs.plan.outputs.store_version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Pagic-desktop-*
          merge-multiple: true
          path: release
      - name: Check release contents and write checksums
        working-directory: release
        run: |
          files=("pagic-$PAGIC_VERSION-macos-aarch64.dmg" "Pagic-$PAGIC_STORE_VERSION-x64.msix" "Pagic-$PAGIC_VERSION-x64-setup.exe")
          shopt -s dotglob nullglob
          actual=(*)
          test "${#actual[@]}" -eq "${#files[@]}"
          for file in "${files[@]}"; do test -f "$file" && test -s "$file" || exit 1; done
          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Pagic-${{ needs.plan.outputs.version }}-desktop-release
          path: release/
          overwrite: true
          if-no-files-found: error
          compression-level: 0

  draft:
    name: Create private draft release
    needs: [plan, collect]
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: pagic-draft-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Pagic-${{ needs.plan.outputs.version }}-desktop-release
          path: release
      - name: Attach verified artifacts to a new draft
        env:
          GH_TOKEN: ${{ github.token }}
          PAGIC_BUILD_SHA: ${{ needs.plan.outputs.source }}
          PAGIC_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          tagged_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          if [[ "$tagged_commit" != "$PAGIC_BUILD_SHA" ]]; then
            echo "The tag no longer points at the built commit" >&2
            exit 1
          fi
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | .tag_name')
          if grep -Fxq -- "$GITHUB_REF_NAME" <<<"$existing"; then
            echo "A release or draft already exists for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Pagic v$PAGIC_VERSION" \
            --notes 'Private testing builds. The EXE is unsigned, the MSIX is an unsigned Store submission candidate, and the macOS app is ad-hoc signed without notarization.'
